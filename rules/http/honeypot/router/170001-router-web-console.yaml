id: 170001
defaultPort: 8081
name: "嵌入式 Web 管理控制台 (工业路由器爆破诱捕)"
nameEn: "Embedded Web Management Console (Industrial Router Honeypot)"
cve: null
category: "honeypot"
vendor: "Generic"
product: "Embedded Router Web Console"
severity: "info"
references:
  - "https://owasp.org/www-project-web-security-testing-guide/"
tags:
  - "http"
  - "router"
  - "honeypot"
ruleVersion: "0.1.0-alpha.1"
descriptionZh: "模拟典型的工业以太网路由器 Web 管理登录控制台，通过捕获爆破和未授权漏洞扫描，实现高价值网卡流量的主动诱捕。"
descriptionEn: "Simulates a typical industrial ethernet router web management login console to actively trap high-value web probes and brute-force scans."
protocol: "http"
configYaml:
  server_header: "Router WebServer/v4.8"
  html: |
    <!DOCTYPE html><html><head><meta charset="utf-8"><title>Embedded Web Management Console</title><style>body { background: #121214; color: #e2e2e8; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }.login-box { background: #1a1a1e; padding: 40px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); width: 320px; border: 1px solid #2e2e34; }h2 { margin: 0 0 24px; font-size: 20px; font-weight: 500; text-align: center; color: #3b82f6; }.input-group { margin-bottom: 16px; }label { display: block; margin-bottom: 6px; font-size: 12px; color: #a1a1aa; }input { width: 100%; padding: 10px; border: 1px solid #3f3f46; background: #27272a; border-radius: 4px; color: #fff; box-sizing: border-box; }button { width: 100%; padding: 12px; border: none; background: #3b82f6; color: #fff; font-size: 14px; font-weight: 500; border-radius: 4px; cursor: pointer; margin-top: 8px; }button:hover { background: #2563eb; }.footer { margin-top: 24px; text-align: center; font-size: 11px; color: #71717a; }</style></head><body><div class="login-box"><h2>Web Management Login</h2><form onsubmit="event.preventDefault(); alert('Authentication timeout. Please try again.');"><div class="input-group"><label>USERNAME</label><input type="text" autocomplete="off" placeholder="admin" required /></div><div class="input-group"><label>PASSWORD</label><input type="password" required /></div><button type="submit">Log In</button></form><div class="footer">Firmware v4.8.1-release. All rights reserved.</div></div></body></html>
  exploit_paths:
    - path: "/cgi-bin/admin.cgi"
      trigger_method: "POST"
      response_status: 401
      response_body: '{"code":-1,"msg":"Authentication failed. IP logged."}'
    - path: "/api/system/upgrade"
      trigger_method: "POST"
      response_status: 400
      response_body: '{"status":"upgrade_failed","reason":"invalid_firmware_signature"}'
