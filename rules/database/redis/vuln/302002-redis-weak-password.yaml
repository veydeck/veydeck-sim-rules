id: 302002
defaultPort: 6379
name: "Redis 弱口令认证"
nameEn: "Redis Weak Password Authentication"
cve: null
category: "vuln_sim"
vendor: "Redis"
product: "Redis"
severity: "medium"
references:
  - "https://redis.io/docs/latest/operate/oss_and_stack/management/security/acl/"
tags:
  - "redis"
  - "database"
  - "weak-password"
  - "auth"
ruleVersion: "0.1.0-alpha.1"
descriptionZh: "仿真启用 AUTH 但使用弱口令的 Redis 服务，用于识别口令猜测、认证绕过和认证后枚举行为。"
descriptionEn: "Simulates a Redis service protected by a weak AUTH password to identify password guessing, authentication bypass, and post-authentication enumeration behavior."
protocol: "redis"
configYaml:
  require_auth: true
  password: "redis"
  server_info:
    role: "master"
    connected_clients: "1"
    acl_users: "1"
  keys:
    app:token: "example-authenticated-token"
    app:secret: "example-redacted-secret"
  command_responses:
    - command: "AUTH"
      response: "OK"
      event_type: "redis_command"
    - command: "CONFIG"
      response: "ERR command is disabled in this simulation"
      event_type: "exploit_attempt"
    - command: "KEYS"
      response: "app:token app:secret"
      event_type: "exploit_attempt"
